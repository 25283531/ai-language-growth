services:
  postgres:
    image: postgres:16-alpine
    container_name: alg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ai_language_growth}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alg} -d ${POSTGRES_DB:-ai_language_growth}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - alg-net

  redis:
    image: redis:7-alpine
    container_name: alg-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - alg-net

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: alg-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-alg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_language_growth}?schema=public
      REDIS_URL: redis://redis:6379
      AI_GATEWAY_MODE: ${AI_GATEWAY_MODE:-mock}
      AI_GATEWAY_LIVE_SERVICES: ${AI_GATEWAY_LIVE_SERVICES:-llm,asr,tts}
      # 所有 Provider 配置必须在此透传；漏一个就会在容器里静默回落 Mock（约束二）。
      # 新增配置项时同步更新 .env.example 与本段。
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MIN_MAX_TOKENS: ${LLM_MIN_MAX_TOKENS:-}
      LLM_EXTRA_BODY_KV: ${LLM_EXTRA_BODY_KV:-}
      TTS_PROTOCOL: ${TTS_PROTOCOL:-openai_audio}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      TTS_SECRET_ID: ${TTS_SECRET_ID:-}
      TTS_SECRET_KEY: ${TTS_SECRET_KEY:-}
      TTS_SERVICE: ${TTS_SERVICE:-}
      TTS_ACTION: ${TTS_ACTION:-}
      TTS_VERSION: ${TTS_VERSION:-}
      TTS_REGION: ${TTS_REGION:-}
      TTS_CODEC: ${TTS_CODEC:-mp3}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE:-}
      TTS_PRIMARY_LANGUAGE: ${TTS_PRIMARY_LANGUAGE:-}
      TTS_VOLUME: ${TTS_VOLUME:-}
      TTS_MODEL_TYPE: ${TTS_MODEL_TYPE:-}
      TTS_AUDIO_FIELD: ${TTS_AUDIO_FIELD:-}
      TTS_EXTRA_BODY_KV: ${TTS_EXTRA_BODY_KV:-}
      AI_AUDIO_DIR: ${AI_AUDIO_DIR:-.cache/audio}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_MODEL: ${ASR_MODEL:-}
      PRONUNCIATION_API_KEY: ${PRONUNCIATION_API_KEY:-}
      PRONUNCIATION_BASE_URL: ${PRONUNCIATION_BASE_URL:-}
      PRONUNCIATION_MODEL: ${PRONUNCIATION_MODEL:-}
      ADMIN_CONFIG_TOKEN: ${ADMIN_CONFIG_TOKEN:-}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3002/reset-password}
      MAIL_DISABLED: ${MAIL_DISABLED:-false}
      FREE_ASR_DAILY_QUOTA_SECONDS: ${FREE_ASR_DAILY_QUOTA_SECONDS:-300}
      FREE_TTS_DAILY_QUOTA_SECONDS: ${FREE_TTS_DAILY_QUOTA_SECONDS:-300}
      FREE_PRONUNCIATION_DAILY_QUOTA_SECONDS: ${FREE_PRONUNCIATION_DAILY_QUOTA_SECONDS:-300}
      MEMBER_ASR_DAILY_QUOTA_SECONDS: ${MEMBER_ASR_DAILY_QUOTA_SECONDS:-1800}
      MEMBER_TTS_DAILY_QUOTA_SECONDS: ${MEMBER_TTS_DAILY_QUOTA_SECONDS:-1800}
      MEMBER_PRONUNCIATION_DAILY_QUOTA_SECONDS: ${MEMBER_PRONUNCIATION_DAILY_QUOTA_SECONDS:-1800}
    volumes:
      - backenddata:/app/.cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - alg-net

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    container_name: alg-admin-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "${ADMIN_WEB_PORT:-3001}:3001"
    networks:
      - alg-net

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: /api/v1
    container_name: alg-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "${WEB_PORT:-3002}:3000"
    networks:
      - alg-net

volumes:
  pgdata:
  redisdata:
  backenddata:

networks:
  alg-net:
    driver: bridge
