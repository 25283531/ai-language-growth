services:
  postgres:
    image: postgres:16-alpine
    container_name: alg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ai_language_growth}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alg} -d ${POSTGRES_DB:-ai_language_growth}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - alg-net

  redis:
    image: redis:7-alpine
    container_name: alg-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - alg-net

  redis-queue:
    image: redis:7-alpine
    container_name: alg-redis-queue
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      # 可覆盖的开发初始值，非容量评估；生产须实测容量并预留 AOF 重写等开销。
      - "${QUEUE_REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - alg-net

  backend:
    image: ghcr.io/25283531/ai-language-growth-backend:latest
    container_name: alg-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-alg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_language_growth}?schema=public
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis-queue:6379}
      AI_GATEWAY_MODE: ${AI_GATEWAY_MODE:-mock}
      AI_GATEWAY_LIVE_SERVICES: ${AI_GATEWAY_LIVE_SERVICES:-llm,asr,tts}
      # 所有 Provider 配置必须在此透传；漏一个就会在容器里静默回落 Mock（约束二）。
      # 新增配置项时同步更新 .env.example 与本段。
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MIN_MAX_TOKENS: ${LLM_MIN_MAX_TOKENS:-}
      LLM_EXTRA_BODY_KV: ${LLM_EXTRA_BODY_KV:-}
      LLM_EXTRA_POLICY: ${LLM_EXTRA_POLICY:-}
      LLM_REQUIRED_EXTRA_KV: ${LLM_REQUIRED_EXTRA_KV:-}
      LLM_FORBIDDEN_EXTRA_KEYS: ${LLM_FORBIDDEN_EXTRA_KEYS:-}
      TTS_PROTOCOL: ${TTS_PROTOCOL:-openai_audio}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      TTS_SECRET_ID: ${TTS_SECRET_ID:-}
      TTS_SECRET_KEY: ${TTS_SECRET_KEY:-}
      TTS_SERVICE: ${TTS_SERVICE:-}
      TTS_ACTION: ${TTS_ACTION:-}
      TTS_VERSION: ${TTS_VERSION:-}
      TTS_REGION: ${TTS_REGION:-}
      TTS_CODEC: ${TTS_CODEC:-mp3}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE:-}
      TTS_PRIMARY_LANGUAGE: ${TTS_PRIMARY_LANGUAGE:-}
      TTS_VOLUME: ${TTS_VOLUME:-}
      TTS_MODEL_TYPE: ${TTS_MODEL_TYPE:-}
      TTS_AUDIO_FIELD: ${TTS_AUDIO_FIELD:-}
      TTS_EXTRA_BODY_KV: ${TTS_EXTRA_BODY_KV:-}
      AI_AUDIO_DIR: ${AI_AUDIO_DIR:-.cache/audio}
      AI_MEDIA_CACHE_DIR: ${AI_MEDIA_CACHE_DIR:-.cache/media}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_MODEL: ${ASR_MODEL:-}
      PRONUNCIATION_API_KEY: ${PRONUNCIATION_API_KEY:-}
      PRONUNCIATION_BASE_URL: ${PRONUNCIATION_BASE_URL:-}
      PRONUNCIATION_MODEL: ${PRONUNCIATION_MODEL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3002/reset-password}
      MAIL_DISABLED: ${MAIL_DISABLED:-false}
      FREE_ASR_DAILY_QUOTA_SECONDS: ${FREE_ASR_DAILY_QUOTA_SECONDS:-300}
      FREE_TTS_DAILY_QUOTA_SECONDS: ${FREE_TTS_DAILY_QUOTA_SECONDS:-300}
      FREE_PRONUNCIATION_DAILY_QUOTA_SECONDS: ${FREE_PRONUNCIATION_DAILY_QUOTA_SECONDS:-300}
      MEMBER_ASR_DAILY_QUOTA_SECONDS: ${MEMBER_ASR_DAILY_QUOTA_SECONDS:-1800}
      MEMBER_TTS_DAILY_QUOTA_SECONDS: ${MEMBER_TTS_DAILY_QUOTA_SECONDS:-1800}
      MEMBER_PRONUNCIATION_DAILY_QUOTA_SECONDS: ${MEMBER_PRONUNCIATION_DAILY_QUOTA_SECONDS:-1800}
      CURRICULUM_GENERATOR_URL: http://curriculum-generator:3200
      CURRICULUM_GENERATOR_TOKEN: ${CURRICULUM_GENERATOR_TOKEN:?CURRICULUM_GENERATOR_TOKEN is required}
    volumes:
      - backenddata:/app/.cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - alg-net

  curriculum-generator:
    image: ghcr.io/25283531/curriculum-generator:latest
    container_name: alg-curriculum-generator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3200
      CURRICULUM_PACKAGE_DIR: /app/data/packages
      BACKEND_INTERNAL_URL: http://backend:3000
      CURRICULUM_GENERATOR_TOKEN: ${CURRICULUM_GENERATOR_TOKEN:?CURRICULUM_GENERATOR_TOKEN is required}
    volumes:
      - curriculum_packages:/app/data/packages
    networks:
      - alg-net
    depends_on:
      backend:
        condition: service_healthy

  admin-web:
    image: ghcr.io/25283531/ai-language-growth-admin-web:latest
    container_name: alg-admin-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "${ADMIN_WEB_PORT:-3001}:3001"
    networks:
      - alg-net

  web:
    image: ghcr.io/25283531/ai-language-growth-web:latest
    container_name: alg-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "${WEB_PORT:-3002}:3000"
    networks:
      - alg-net

volumes:
  pgdata:
  redisdata:
  redisqueuedata:
  backenddata:
  curriculum_packages:

networks:
  alg-net:
    driver: bridge
