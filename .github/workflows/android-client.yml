name: Android Formal Client

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name
        required: true
        default: '0.0.3'
      version_code:
        description: App version code
        required: true
        default: '3'
      build_type:
        description: APK build type
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-client.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-client.yml'

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # 最低质量门禁（打包前）：JVM 单测无需设备，lint 为静态检查。
      # 任一失败即中止 job，后续 Assemble APK / Upload APK 都不会执行（失败时不上传 APK）。
      - name: Quality gate - JVM unit tests
        run: |
          set -o pipefail
          gradle --no-daemon -p apps/android testDebugUnitTest --stacktrace 2>&1 | tee /tmp/android-test.log
      - name: Summarize Android test failure
        if: failure()
        run: |
          {
            echo '### Android unit test failure'
            echo '```text'
            tail -n 160 /tmp/android-test.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate Android test failure
        if: failure()
        run: |
          grep -E '(^e: |FAILED|Execution failed|Caused by:|What went wrong|error:)' /tmp/android-test.log 2>/dev/null \
            | head -n 10 \
            | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
      - name: Quality gate - lint
        run: gradle --no-daemon -p apps/android lintDebug
      # 端侧 TTS 评测用（Kokoro）：官方 int8 多语种模型，构建时下载并校验，不进仓库。
      - name: Fetch offline TTS model (sherpa-onnx Kokoro)
        run: |
          set -euo pipefail
          KOKORO_DIR=apps/android/app/src/main/assets/tts-kokoro
          mkdir -p "$KOKORO_DIR"
          curl -fsSL -o /tmp/kokoro.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          tar -xjf /tmp/kokoro.tar.bz2 -C /tmp
          SRC=/tmp/kokoro-int8-multi-lang-v1_0
          echo "model.int8.onnx bytes: $(stat -c %s $SRC/model.int8.onnx)"
          # 验收门槛：必须 >100MB；只有 133 字节说明是坏的 LFS 指针，直接失败。
          test "$(stat -c %s $SRC/model.int8.onnx)" -gt 104857600
          cp "$SRC/model.int8.onnx" "$KOKORO_DIR/"
          cp "$SRC/voices.bin" "$KOKORO_DIR/"
          cp "$SRC/tokens.txt" "$KOKORO_DIR/"
          cp "$SRC/lexicon-us-en.txt" "$KOKORO_DIR/"
          cp "$SRC/lexicon-zh.txt" "$KOKORO_DIR/"
          cp "$SRC"/*.fst "$KOKORO_DIR/"
          cp -r "$SRC/espeak-ng-data" "$KOKORO_DIR/"
          du -sh "$KOKORO_DIR"
          # JNI 原生库同样在构建时拉取，避免 51MB 二进制进仓库。
          # 版本必须 < 2.0.0：sherpa-onnx >= 2.0.0 已废弃并**忽略** --vits-data-dir，
          # Piper 模型因此无法用内置 espeak 音素化（实测报 phoneme_codepoints is empty）。
          curl -fsSL -o /tmp/sherpa-android.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.20/sherpa-onnx-v1.12.20-android.tar.bz2
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp
          mkdir -p apps/android/app/src/main/jniLibs
          cp -r /tmp/jniLibs/arm64-v8a /tmp/jniLibs/armeabi-v7a apps/android/app/src/main/jniLibs/
          ls -lh apps/android/app/src/main/jniLibs/arm64-v8a
      - name: Prepare release signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is required for release builds" >&2; exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/alg-release.keystore"
      - name: Assemble APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/alg-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.event.inputs.version_name || '0.0.3' }}
          APP_VERSION_CODE: ${{ github.event.inputs.version_code || '3' }}
          APK_BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          if [ "$APK_BUILD_TYPE" = "release" ]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            gradle --no-daemon -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" assembleRelease
          else
            gradle --no-daemon -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" assembleDebug
          fi
      - name: Upload APK
        # 仅在前面所有步骤（含质量门禁与 assemble）都成功时上传；门禁失败不产出 APK 产物。
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-client-${{ github.event.inputs.build_type || 'debug' }}-${{ github.event.inputs.version_name || '0.0.3' }}
          path: apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
