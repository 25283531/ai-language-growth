name: Android Formal Client

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name
        required: true
        default: '0.0.1'
      version_code:
        description: App version code
        required: true
        default: '1'
      build_type:
        description: APK build type
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-client.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-client.yml'

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare release signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is required for release builds" >&2; exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/alg-release.keystore"
      - name: Assemble APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/alg-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.event.inputs.version_name || '0.0.1' }}
          APP_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          APK_BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          if [ "$APK_BUILD_TYPE" = "release" ]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            gradle --no-daemon -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" assembleRelease
          else
            gradle --no-daemon -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" assembleDebug
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-client-${{ github.event.inputs.build_type || 'debug' }}-${{ github.event.inputs.version_name || '0.0.1' }}
          path: apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
