name: CI

# M1 核心 CI：在无数据库、无密钥的干净环境里跑通构建 / 类型检查 / 单测。
# AI Gateway 固定走 mock，不产生任何外部模型调用与费用（D-024 约束二）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Workflow-local disposable PostgreSQL; no production credentials or datasets.
  DATABASE_URL: postgresql://alg_ci:alg_ci@127.0.0.1:5432/alg_ci?schema=public
  # 不调用任何外部服务；教学逻辑与模型选择都在后端 mock 模式内完成。
  AI_GATEWAY_MODE: mock
  # 绝对路径：resolveAudioDir() 默认按 cwd 解析，仓库根与 services/backend 曾各写一份
  # split-brain 音频缓存。固定在 runner 临时目录（ubuntu-latest 保证可写、job 结束即销毁），
  # 让单测 / mock API / integration 各步骤共用同一目录。
  # 这里用固定值而非 ${{ runner.temp }}：workflow 级 env 不允许使用 runner context。
  AI_AUDIO_DIR: /tmp/alg-ci-audio-cache

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      queue-test-redis:
        image: redis:7-alpine
        # Redis service command cannot be overridden by Actions; integration step
        # explicitly configures this disposable instance before worker startup.
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alg_ci
          POSTGRES_PASSWORD: alg_ci
          POSTGRES_DB: alg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alg_ci -d alg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: services/backend
        run: npx prisma generate

      # 显式按依赖顺序构建：契约层必须先产出 dist，其余库才能通过
      # node_modules 里的 workspace 软链解析到 @alg/shared-contracts 的类型声明
      # （npm run build --workspaces 不保证拓扑顺序，直接从干净状态跑会 TS2307）。
      - name: Build workspace packages
        run: |
          npm run build --workspace @alg/shared-contracts
          npm run build --workspace @alg/ai-provider-sdk
          npm run build --workspace @alg/curriculum
          npm run build --workspace @alg/model-router
          npm run build --workspace @alg/skill-graph
          npm run build --workspace @alg/backend

      - name: Apply schema and seed reviewed prototype curriculum
        run: |
          npm run prisma:migrate --workspace @alg/backend
          npm run prisma:seed --workspace @alg/backend

      - name: Build web workbench
        run: npm run build --workspace @alg/web

      - name: Build model provider console
        run: npm run build --workspace @alg/admin-web

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # 包含 Provider 协议适配器的签名向量、配置 fail-fast 与约束二静态守卫；
        # 以及 P0 回归守卫（learners 鉴权 / 教材映射 / 双轨难度档 / 预算熔断 / 家长 Web 端取数鉴权）。
        #
        # 必须带 --tsconfig services/backend/tsconfig.json：
        #   learners-auth / planner-track-band / ai-gateway-budget 会 import 带 Nest 装饰器的模块
        #   （@Controller / @Injectable / @Inject），而仓库根只有 tsconfig.base.json，未开
        #   experimentalDecorators，从根目录裸跑 tsx --test 会整体 TransformError：
        #   "Parameter decorators only work when experimental decorators are enabled"。
        #   统一加这个参数后，纯函数类用例（skill-graph / model-router / cefr / 静态守卫）也照常通过。
        #
        # 注意：m1-api.integration.test.ts 依赖真实 Postgres + 起好的 mock API，
        # 必须留在下面的 "M1 API flow" 步骤，不要加进本清单。
        #
        # TTS 课程级作用域 / 隐私隔离 / 韵律契约 / 发音教练回归（全离线，不调用供应商）。
        # 这些文件与 tts-cache.test.ts 同批维护；任一缺失会被下面的 run 命令直接报错。
        run: |
          npx tsx --tsconfig services/backend/tsconfig.json --test \
            services/backend/test/review-policy.test.ts \
            services/backend/test/growth-followup.test.ts \
            services/backend/test/prisma-usage-ledger.test.ts \
            services/backend/test/learners-auth.test.ts \
            services/backend/test/parent-report.test.ts \
            services/backend/test/textbook-skill-mapping.test.ts \
            services/backend/test/planner-track-band.test.ts \
            services/backend/test/planner-adaptive-choice.test.ts \
            services/backend/test/provider-benchmark.test.ts \
            services/backend/test/ai-gateway-budget.test.ts \
            services/backend/test/tts-cache.test.ts \
            services/backend/test/tts-scope.test.ts \
            services/backend/test/tts-privacy.test.ts \
            services/backend/test/prosody-contract.test.ts \
            services/backend/test/tts-public-scope.test.ts \
            services/backend/test/pronunciation-coach.test.ts \
            services/backend/test/word-pronunciation-routing.test.ts \
            services/backend/test/speech-usage.test.ts \
            services/backend/test/usage-cost.test.ts \
            services/backend/test/usage-budget.test.ts \
            services/backend/test/admin-console-static-guard.test.ts \
            services/backend/test/web-client-auth-guard.test.ts \
            services/backend/test/queue-runtime.test.ts \
            services/backend/test/image-cache-queue.test.ts \
            packages/skill-graph/test/mastery.test.ts \
            packages/model-router/test/router.test.ts \
            packages/shared-contracts/test/cefr.test.ts \
            packages/ai-provider-sdk/test/*.test.ts

      - name: Usage cost aggregation DB integration
        env:
          USAGE_COST_DB_INTEGRATION: '1'
        run: npx tsx --tsconfig services/backend/tsconfig.json --test services/backend/test/usage-cost.integration.test.ts

      - name: P1-6 adaptive planner LLM call budget
        env:
          P1_6_DB_INTEGRATION: '1'
          P1_6_EXPECT_LLM_CALLS: '1'
        run: npx tsx --tsconfig services/backend/tsconfig.json --test services/backend/test/p1-6-adaptive-ledger.integration.test.ts

      - name: P1-7 benchmark readiness persistence
        env:
          P1_7_DB_INTEGRATION: '1'
        run: npx tsx --tsconfig services/backend/tsconfig.json --test services/backend/test/p1-7-benchmark.integration.test.ts

      - name: Disposable queue Redis integration
        env:
          QUEUE_TEST_REDIS_URL: redis://127.0.0.1:6381/15
          QUEUE_TEST_REDIS_DISPOSABLE_AUTHORIZED: '1'
        run: npx tsx --tsconfig services/backend/tsconfig.json --test services/backend/test/queue-redis.integration.test.ts

      - name: Start mock API for M1 integration acceptance
        env:
          NODE_ENV: development
          # 一次性测试管理员；仅用于本地/CI mock 链路，不是生产凭据。
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-only
        run: |
          nohup node services/backend/dist/main.js >/tmp/alg-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alg-backend.log
          exit 1

      - name: M1 API flow, TTS cache, idempotency, and growth archive
        run: npx tsx --test services/backend/test/m1-api.integration.test.ts

      - name: P2-2E speech usage flow and ledger reconciliation
        env:
          P2_2E_DB_INTEGRATION: '1'
          P2_2E_API_URL: http://127.0.0.1:3100/api/v1
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-only
        run: npx tsx --tsconfig services/backend/tsconfig.json --test services/backend/test/p2-2e-usage-flow.integration.test.ts
