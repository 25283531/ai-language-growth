name: CI

# M1 核心 CI：在无数据库、无密钥的干净环境里跑通构建 / 类型检查 / 单测。
# AI Gateway 固定走 mock，不产生任何外部模型调用与费用（D-024 约束二）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Workflow-local disposable PostgreSQL; no production credentials or datasets.
  DATABASE_URL: postgresql://alg_ci:alg_ci@127.0.0.1:5432/alg_ci?schema=public
  # 不调用任何外部服务；教学逻辑与模型选择都在后端 mock 模式内完成。
  AI_GATEWAY_MODE: mock

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alg_ci
          POSTGRES_PASSWORD: alg_ci
          POSTGRES_DB: alg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alg_ci -d alg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: services/backend
        run: npx prisma generate

      # 显式按依赖顺序构建：契约层必须先产出 dist，其余库才能通过
      # node_modules 里的 workspace 软链解析到 @alg/shared-contracts 的类型声明
      # （npm run build --workspaces 不保证拓扑顺序，直接从干净状态跑会 TS2307）。
      - name: Build workspace packages
        run: |
          npm run build --workspace @alg/shared-contracts
          npm run build --workspace @alg/ai-provider-sdk
          npm run build --workspace @alg/curriculum
          npm run build --workspace @alg/model-router
          npm run build --workspace @alg/skill-graph
          npm run build --workspace @alg/backend

      - name: Apply schema and seed reviewed prototype curriculum
        run: |
          npm run prisma:migrate --workspace @alg/backend
          npm run prisma:seed --workspace @alg/backend

      - name: Build web workbench
        run: npm run build --workspace @alg/web

      - name: Build model provider console
        run: npm run build --workspace @alg/admin-web

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # 包含 Provider 协议适配器的签名向量、配置 fail-fast 与约束二静态守卫
        run: |
          npx tsx --test \
            services/backend/test/review-policy.test.ts \
            services/backend/test/growth-followup.test.ts \
            services/backend/test/prisma-usage-ledger.test.ts \
            packages/skill-graph/test/mastery.test.ts \
            packages/model-router/test/router.test.ts \
            packages/ai-provider-sdk/test/*.test.ts

      - name: Start mock API for M1 integration acceptance
        env:
          NODE_ENV: development
        run: |
          nohup node services/backend/dist/main.js >/tmp/alg-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alg-backend.log
          exit 1

      - name: M1 API flow, TTS cache, idempotency, and growth archive
        run: npx tsx --test services/backend/test/m1-api.integration.test.ts
