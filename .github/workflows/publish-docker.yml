name: Publish application Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/25283531/ai-language-growth-backend
            dockerfile: deploy/docker/backend.Dockerfile
          - name: admin-web
            image: ghcr.io/25283531/ai-language-growth-admin-web
            dockerfile: apps/admin-web/Dockerfile
          - name: web
            image: ghcr.io/25283531/ai-language-growth-web
            dockerfile: apps/web/Dockerfile
            build_args: NEXT_PUBLIC_API_BASE=/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
