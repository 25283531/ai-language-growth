name: Android Audio Prototype

# M1 最小音频链路原型：只在原型目录（或本工作流）变更时构建，也可手动触发。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android-audio-prototype/**'
      - '.github/workflows/android-audio-prototype.yml'
  pull_request:
    paths:
      - 'apps/android-audio-prototype/**'
      - '.github/workflows/android-audio-prototype.yml'

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 项目未提交 gradle-wrapper.jar，因此用 setup-gradle 安装指定版本并加入 PATH，
      # 直接调用 gradle 而不是 ./gradlew。gradle/wrapper/gradle-wrapper.properties
      # 保留给本地 Android Studio / 自建 wrapper 使用。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Toolchain info
        working-directory: apps/android-audio-prototype
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null || true

      - name: Assemble debug APK
        working-directory: apps/android-audio-prototype
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-audio-prototype-debug
          path: apps/android-audio-prototype/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
